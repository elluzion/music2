<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon/xsmall.png" type="image/png" sizes="16x16" />
		<link rel="icon" href="/favicon/small.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon/medium.png" type="image/png" sizes="48x48" />
		<link rel="icon" href="/favicon/large.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/favicon/apple-icon.png" type="image/png" sizes="180x180" />
		<title>Elluzion</title>
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
